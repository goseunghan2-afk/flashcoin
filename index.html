<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flash USDT Generator</title>
    <style>
        body {
            font-family: 'Arial', sans-serif;
            background-color: #f5f7fa;
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }
        .container {
            background: white;
            padding: 30px;
            border-radius: 20px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            width: 100%;
            max-width: 400px;
            text-align: center;
        }
        h2 { color: #333; margin-bottom: 20px; }
        
        /* Input Styles */
        .input-group { margin-bottom: 15px; text-align: left; }
        label { display: block; margin-bottom: 5px; color: #666; font-size: 14px; }
        input, select {
            width: 100%;
            padding: 12px;
            border: 1px solid #ddd;
            border-radius: 8px;
            font-size: 16px;
            box-sizing: border-box;
        }
        
        /* Button */
        button {
            width: 100%;
            padding: 15px;
            background-color: #007bff;
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 18px;
            cursor: pointer;
            transition: 0.3s;
            margin-top: 10px;
        }
        button:hover { background-color: #0056b3; }

        /* Result Area */
        #result-area {
            display: none;
            margin-top: 20px;
            border-top: 2px dashed #eee;
            padding-top: 20px;
        }
        .wallet-preview {
            background: #fff;
            border: 1px solid #eee;
            border-radius: 10px;
            padding: 15px;
            text-align: left;
            position: relative;
            overflow: hidden;
        }
        .token-row {
            display: flex;
            align-items: center;
            margin-bottom: 10px;
        }
        .token-icon {
            width: 40px;
            height: 40px;
            background: #000; 
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-weight: bold;
            margin-right: 10px;
        }
        .token-info {
            flex-grow: 1;
        }
        .token-info h4 { margin: 0; font-size: 16px; }
        .token-balance { font-size: 18px; font-weight: bold; color: #333; }
        
        .flash-badge {
            background: #ffcc00;
            color: black;
            font-size: 12px;
            padding: 2px 6px;
            border-radius: 4px;
            margin-left: 5px;
        }

        /* QR Code area */
        .qr-placeholder {
            margin: 15px auto;
            width: 150px;
            height: 150px;
            background: #f0f0f0;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #999;
        }
        
        .copy-btn {
            background: #28a745;
            margin-top: 10px;
        }
        .copy-btn:hover { background: #218838; }
    </style>
</head>
<body>

<div class="container">
    <h2>⚡ Flash USDT Generator</h2>
    
    <div class="input-group">
        <label>받는 지갑 주소 (TRC20)</label>
        <input type="text" id="walletAddress" placeholder="T9y... 시작하는 주소 입력">
    </div>

    <div class="input-group">
        <label>생성할 금액 (USDT)</label>
        <input type="number" id="amount" placeholder="예: 100000">
    </div>

    <div class="input-group">
        <label>유효 기간 (Days)</label>
        <select id="days">
            <option value="1">1 Day</option>
            <option value="3">3 Days</option>
            <option value="7">7 Days</option>
            <option value="30">30 Days</option>
            <option value="9999">Permanent (No Expiry)</option>
        </select>
    </div>

    <button onclick="generateWallet()">Generate Wallet</button>

    <div id="result-area">
        <h3>✅ 생성 완료!</h3>
        <p>아래 지갑을 복사하거나 스크린샷을 찍어 사용하세요.</p>
        
        <!-- Fake Wallet UI -->
        <div class="wallet-preview">
            <div class="token-row">
                <div class="token-icon">₮</div>
                <div class="token-info">
                    <h4>Tether USD <span class="flash-badge">FLASH</span></h4>
                    <div class="token-balance" id="displayBalance">0.00 USDT</div>
                </div>
            </div>
            <div style="font-size: 12px; color: #888; margin-top: 10px;">
                Address: <span id="displayAddress">Loading...</span>
            </div>
        </div>

        <div class="qr-placeholder">
            [QR CODE HERE]
        </div>

        <button class="copy-btn" onclick="copyToClipboard()">Copy Address & Amount</button>
    </div>
</div>

<script>
    function generateWallet() {
        const address = document.getElementById('walletAddress').value;
        const amount = document.getElementById('amount').value;
        const days = document.getElementById('days').value;

        if(!address || !amount) {
            alert("주소와 금액을 모두 입력해주세요.");
            return;
        }

        // 결과 표시 영역 보이기
        document.getElementById('result-area').style.display = 'block';
        
        // 데이터 업데이트
        document.getElementById('displayAddress').innerText = address;
        document.getElementById('displayBalance').innerText = Number(amount).toLocaleString() + " USDT";
        
        console.log(`Generated for ${address}: ${amount} USDT for ${days} days.`);
    }

    function copyToClipboard() {
        const address = document.getElementById('walletAddress').value;
        const amount = document.getElementById('amount').value;
        const text = `Address: ${address}\nAmount: ${amount} USDT`;
        
        navigator.clipboard.writeText(text).then(() => {
            alert("주소와 금액이 클립보드에 복사되었습니다!");
        });
    }
</script>

</body>
</html>
